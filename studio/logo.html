<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  html, body { background: transparent !important; }
  .stage { background: transparent; display: grid; place-items: center; }
  .tile { position: relative; width: 88vmin; height: 88vmin; border-radius: 22%;
    background:
      radial-gradient(120% 80% at 50% 115%, rgba(88,101,242,.95) 0%, rgba(88,101,242,.25) 45%, transparent 70%),
      radial-gradient(60% 50% at 85% 0%, rgba(200,255,46,.18), transparent 70%),
      #0a0a10;
    overflow: hidden; box-shadow: inset 0 0 0 1.5vmin rgba(255,255,255,.04); }
  .tile .dots { opacity: .7; }
  /* speech-bubble: orb + tail */
  .bubble { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -52%); }
  .bubble .orb { --s: 58vmin; }
  .tail { position: absolute; width: 19vmin; height: 19vmin; left: 0vmin; bottom: -5vmin;
    background: linear-gradient(160deg, #e4ff7a, #c8ff2e 45%, #8fc410);
    clip-path: polygon(48% 0, 100% 34%, 0 100%); filter: drop-shadow(0 2vmin 3vmin rgba(0,0,0,.4)); }
  .spark { position: absolute; right: -2vmin; top: 3vmin; width: 9vmin; height: 9vmin; }
  .spark path { fill: var(--lime); }
</style></head><body><div class="stage">
  <div class="tile"><div class="dots"></div>
    <div class="bubble">
      <div class="tail"></div>
      <div class="orb rim"><div class="eye l"></div><div class="eye r"></div></div>
      <svg class="spark" viewBox="0 0 100 100"><path d="M50 0 C54 34 66 46 100 50 C66 54 54 66 50 100 C46 66 34 54 0 50 C34 46 46 34 50 0Z"/></svg>
    </div>
  </div>
</div></body></html>
